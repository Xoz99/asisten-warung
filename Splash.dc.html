<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: oklch(56% 0.14 45); }
    a:hover { color: oklch(46% 0.14 45); }
  </style>
</helmet>

<div style="width:390px; height:844px; background:oklch(13% 0.008 60); font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:white; display:flex; flex-direction:column; overflow:hidden; position:relative;">

  <!-- Decorative glow + rings -->
  <div style="position:absolute; top:-90px; right:-70px; width:280px; height:280px; border-radius:999px; background:radial-gradient(circle, oklch(56% 0.14 45 / 0.5) 0%, oklch(56% 0.14 45 / 0) 70%);"></div>
  <div style="position:absolute; top:60px; right:40px; width:120px; height:120px; border-radius:999px; border:1.5px solid oklch(100% 0 0 / 0.08);"></div>
  <div style="position:absolute; top:100px; right:80px; width:190px; height:190px; border-radius:999px; border:1.5px solid oklch(100% 0 0 / 0.06);"></div>

  <div style="position:relative; flex:1; display:flex; flex-direction:column; padding:64px 30px 40px 30px;">

    <!-- Card mockup -->
    <div style="width:100%; aspect-ratio:1.55; border-radius:22px; background:linear-gradient(155deg, oklch(26% 0.02 55) 0%, oklch(16% 0.01 60) 60%, oklch(12% 0.006 60) 100%); padding:22px 22px; display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 20px 40px oklch(0% 0 0 / 0.4);">
      <div style="display:flex; flex-direction:column; gap:4px;">
        <div style="font-size:11px; font-weight:700; letter-spacing:0.08em; color:oklch(100% 0 0 / 0.55); text-transform:uppercase;">Toko Digital</div>
        <div style="font-size:19px; font-weight:800;">Warung Bu Siti</div>
      </div>
      <div style="display:flex; align-items:flex-end; justify-content:space-between;">
        <div style="font-size:12.5px; font-weight:600; letter-spacing:0.15em; color:oklch(100% 0 0 / 0.7);">&bull;&bull;&bull;&bull; BDG</div>
        <div style="width:38px; height:38px; border-radius:999px; background:oklch(56% 0.14 45); display:flex; align-items:center; justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5 12 3l9 6.5"></path>
            <path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- Title -->
    <div style="margin-top:52px; display:flex; flex-direction:column; gap:2px;">
      <div style="font-size:42px; font-weight:800; line-height:1.05; letter-spacing:0.01em;">WARUNG</div>
      <div style="font-size:42px; font-weight:800; line-height:1.05; letter-spacing:0.01em; color:oklch(70% 0.13 45);">PINTAR</div>
    </div>

    <div style="margin-top:18px; font-size:14.5px; font-weight:500; line-height:1.6; color:oklch(78% 0.008 60); max-width:300px;">
      Catat jualan cukup ngomong, stok &amp; utang kecatat otomatis. Untung hari ini kelihatan tanpa rekap manual.
    </div>

    <div style="flex:1;"></div>

    <div style="width:100%; padding:17px 0; border-radius:999px; background:white; color:oklch(13% 0.008 60); font-size:15px; font-weight:800; text-align:center;">
      Mulai
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
