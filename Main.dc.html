<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: oklch(56% 0.14 45); }
    a:hover { color: oklch(46% 0.14 45); }

    @keyframes voiceIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes micPulse {
      0% { transform: scale(1); opacity: 0.45; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    .fab-btn { transition: transform 140ms ease, box-shadow 140ms ease; }
    .fab-btn:active { transform: scale(0.93) !important; box-shadow: 0 3px 10px oklch(56% 0.14 45 / 0.35) !important; }

    .close-btn { transition: opacity 140ms ease; }
    .close-btn:active { opacity: 0.55; }

    .mode-btn { transition: opacity 140ms ease, transform 140ms ease; }
    .mode-btn:active { opacity: 0.6; transform: scale(0.94); }

    .bell-btn { transition: opacity 140ms ease; }
    .bell-btn:active { opacity: 0.6; }

    .scroll-area { scrollbar-width: none; }
    .scroll-area::-webkit-scrollbar { display: none; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:oklch(97% 0.006 85); font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:oklch(12% 0.005 60); display:flex; flex-direction:column; overflow:hidden; position:relative;">

  <!-- Greeting (pinned) -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:32px 22px 18px 22px; border-bottom:2px solid oklch(90% 0.006 80);">
    <div style="display:flex; flex-direction:column; gap:5px;">
      <div style="font-size:13px; color:oklch(42% 0.01 60); font-weight:600;">Selamat pagi</div>
      <div style="font-size:22px; font-weight:800;">Warung Bu Siti</div>
    </div>
    <div class="bell-btn" style="width:42px; height:42px; border-radius:999px; background:#fff; border:1.75px solid oklch(88% 0.006 80); display:flex; align-items:center; justify-content:center; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(30% 0.01 60)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13 6 9Z"></path>
        <path d="M10 18.5a2 2 0 0 0 4 0"></path>
      </svg>
    </div>
  </div>

  <!-- Scrollable content -->
  <div class="scroll-area" style="flex:1; overflow-y:auto; padding:20px 22px 24px 22px; display:flex; flex-direction:column; gap:22px;">

    <!-- Untung Hari Ini — dark gradient hero card -->
    <div style="position:relative; overflow:hidden; display:flex; flex-direction:column; gap:10px; padding:24px 24px; background:linear-gradient(155deg, oklch(24% 0.01 60) 0%, oklch(15% 0.008 60) 55%, oklch(12% 0.006 60) 100%); border-radius:22px;">
      <div style="position:absolute; top:-46px; right:-30px; width:150px; height:150px; border-radius:999px; background:radial-gradient(circle, oklch(56% 0.14 45 / 0.55) 0%, oklch(56% 0.14 45 / 0) 70%);"></div>
      <div style="position:absolute; top:14px; right:16px; width:64px; height:64px; border-radius:999px; border:1.5px solid oklch(100% 0 0 / 0.1);"></div>

      <div style="position:relative; font-size:10.5px; font-weight:700; color:oklch(100% 0 0 / 0.6); text-transform:uppercase; letter-spacing:0.05em;">Untung Hari Ini</div>
      <div style="position:relative; font-size:32px; font-weight:800; color:white; font-variant-numeric:tabular-nums;">Rp 147.500</div>

      <div style="position:relative; width:100%; height:5px; border-radius:999px; background:oklch(100% 0 0 / 0.12); margin:6px 0 2px 0;">
        <div style="width:62%; height:100%; border-radius:999px; background:oklch(70% 0.13 45);"></div>
      </div>

      <div style="position:relative; display:flex; align-items:center; justify-content:space-between;">
        <div style="font-size:12px; font-weight:600; color:oklch(100% 0 0 / 0.7);">23 transaksi hari ini</div>
        <div style="font-size:12px; font-weight:600; color:oklch(100% 0 0 / 0.7);">Target Rp 240rb</div>
      </div>
    </div>

    <!-- Transaksi Terakhir -->
    <div style="display:flex; flex-direction:column; gap:2px;">
      <div style="font-size:15px; font-weight:800; margin-bottom:6px;">Transaksi Terakhir</div>

      <sc-for list="{{recentTx}}" as="tx" hint-placeholder-count="4">
        <div style="display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1.5px solid oklch(90% 0.006 80);">
          <div style="width:42px; height:42px; border-radius:999px; background:{{tx.iconBg}}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <sc-if value="{{tx.kind}}" hint-placeholder-val="jual">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{tx.iconColor}}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 8a2 2 0 0 1 2-2h1.2a1 1 0 0 0 .87-.5l.7-1.2A1 1 0 0 1 9.6 4h4.8a1 1 0 0 1 .87.5l.7 1.2a1 1 0 0 0 .87.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"></path>
                <circle cx="12" cy="13" r="3.2"></circle>
              </svg>
            </sc-if>
          </div>
          <div style="display:flex; flex-direction:column; gap:2px; min-width:0; flex:1;">
            <div style="font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{tx.title}}</div>
            <div style="font-size:11.5px; font-weight:600; color:oklch(45% 0.01 60);">{{tx.time}}</div>
          </div>
          <div style="font-size:14px; font-weight:800; color:{{tx.amountColor}}; white-space:nowrap;">{{tx.amount}}</div>
        </div>
      </sc-for>
    </div>

  </div>

  <!-- Bottom nav with floating mic FAB -->
  <div style="position:relative;">

    <div style="display:grid; grid-template-columns:1fr 1fr 70px 1fr 1fr; align-items:center; padding:9px 18px 16px 18px; border-top:2px solid oklch(83% 0.008 80); background:oklch(97% 0.006 85);">

      <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:5px 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(35% 0.01 60)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 8 12 3.5 20.5 8 12 12.5 3.5 8Z"></path>
          <path d="M3.5 8v8.5L12 21l8.5-4.5V8"></path>
          <line x1="12" y1="12.5" x2="12" y2="21"></line>
        </svg>
        <div style="font-size:10.5px; font-weight:700; color:oklch(35% 0.01 60);">Stok</div>
      </div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:5px 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(35% 0.01 60)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"></path>
          <path d="M3 9h18"></path>
          <circle cx="16" cy="13.5" r="0.7" fill="oklch(35% 0.01 60)" stroke="none"></circle>
        </svg>
        <div style="font-size:10.5px; font-weight:700; color:oklch(35% 0.01 60);">Kasbon</div>
      </div>

      <div></div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:5px 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(35% 0.01 60)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="20" x2="5" y2="12"></line>
          <line x1="12" y1="20" x2="12" y2="7"></line>
          <line x1="19" y1="20" x2="19" y2="14"></line>
          <line x1="3" y1="20" x2="21" y2="20"></line>
        </svg>
        <div style="font-size:10.5px; font-weight:700; color:oklch(35% 0.01 60);">Laporan</div>
      </div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:5px 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="oklch(35% 0.01 60)">
          <circle cx="5" cy="12" r="1.7"></circle>
          <circle cx="12" cy="12" r="1.7"></circle>
          <circle cx="19" cy="12" r="1.7"></circle>
        </svg>
        <div style="font-size:10.5px; font-weight:700; color:oklch(35% 0.01 60);">Lainnya</div>
      </div>

    </div>

    <!-- Floating mic button (primary — catat transaksi via suara) -->
    <div class="fab-btn" onClick="{{openCatat}}" style="position:absolute; left:50%; margin-left:-33px; top:-28px; width:66px; height:66px; border-radius:999px; background:oklch(56% 0.14 45); border:5px solid oklch(97% 0.006 85); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px oklch(56% 0.14 45 / 0.4); cursor:pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
        <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
        <line x1="12" y1="18" x2="12" y2="22"></line>
        <line x1="8" y1="22" x2="16" y2="22"></line>
      </svg>
    </div>

  </div>

  <!-- Catat transaksi overlay — voice default + fallback modes -->
  <sc-if value="{{catatOpen}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute; inset:0; background:oklch(14% 0.008 60); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; animation:voiceIn 280ms ease both; z-index:10;">

      <div class="close-btn" onClick="{{closeCatat}}" style="position:absolute; top:24px; right:20px; width:44px; height:44px; border-radius:999px; background:oklch(100% 0 0 / 0.12); display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
          <line x1="5" y1="5" x2="19" y2="19"></line>
          <line x1="19" y1="5" x2="5" y2="19"></line>
        </svg>
      </div>

      <!-- Mic button with pulsing rings -->
      <div style="position:relative; width:150px; height:150px; display:flex; align-items:center; justify-content:center;">
        <div style="position:absolute; width:100px; height:100px; border-radius:999px; background:oklch(56% 0.14 45); animation:micPulse 1.8s ease-out infinite;"></div>
        <div style="position:absolute; width:100px; height:100px; border-radius:999px; background:oklch(56% 0.14 45); animation:micPulse 1.8s ease-out infinite 0.6s;"></div>
        <div style="position:relative; width:100px; height:100px; border-radius:999px; background:oklch(56% 0.14 45); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px oklch(0% 0 0 / 0.3);">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="8" y1="22" x2="16" y2="22"></line>
          </svg>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="color:white; font-size:17px; font-weight:800;">Tekan &amp; tahan, lalu bicara</div>
        <div style="color:oklch(72% 0.01 60); font-size:13.5px; font-weight:500; text-align:center; max-width:250px; line-height:1.5;">Contoh: &ldquo;Tiga mie goreng, satu minyak goreng&rdquo;</div>
      </div>

      <!-- Fallback modes -->
      <div style="display:flex; align-items:flex-start; gap:28px; margin-top:6px;">
        <div class="mode-btn" style="display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer;">
          <div style="width:48px; height:48px; border-radius:999px; background:oklch(100% 0 0 / 0.1); display:flex; align-items:center; justify-content:center;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(85% 0.01 60)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 8a2 2 0 0 1 2-2h1.2a1 1 0 0 0 .87-.5l.7-1.2A1 1 0 0 1 9.6 4h4.8a1 1 0 0 1 .87.5l.7 1.2a1 1 0 0 0 .87.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"></path>
              <circle cx="12" cy="13" r="3.4"></circle>
            </svg>
          </div>
          <div style="color:oklch(72% 0.01 60); font-size:10.5px; font-weight:600;">Scan Visual</div>
        </div>

        <div class="mode-btn" style="display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer;">
          <div style="width:48px; height:48px; border-radius:999px; background:oklch(100% 0 0 / 0.1); display:flex; align-items:center; justify-content:center;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(85% 0.01 60)" stroke-width="1.8" stroke-linecap="round">
              <rect x="3.5" y="6" width="17" height="12" rx="1.5"></rect>
              <line x1="6.5" y1="8.5" x2="6.5" y2="15.5"></line>
              <line x1="9" y1="8.5" x2="9" y2="15.5"></line>
              <line x1="11.5" y1="8.5" x2="11.5" y2="15.5" stroke-width="2.6"></line>
              <line x1="14" y1="8.5" x2="14" y2="15.5"></line>
              <line x1="16.5" y1="8.5" x2="16.5" y2="15.5" stroke-width="2.6"></line>
            </svg>
          </div>
          <div style="color:oklch(72% 0.01 60); font-size:10.5px; font-weight:600;">Barcode</div>
        </div>

        <div class="mode-btn" style="display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer;">
          <div style="width:48px; height:48px; border-radius:999px; background:oklch(100% 0 0 / 0.1); display:flex; align-items:center; justify-content:center;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(85% 0.01 60)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="6.5" width="17" height="11" rx="1.5"></rect>
              <line x1="7" y1="10" x2="7" y2="10"></line>
              <line x1="10" y1="10" x2="10" y2="10"></line>
              <line x1="13" y1="10" x2="13" y2="10"></line>
              <line x1="16" y1="10" x2="16" y2="10"></line>
              <line x1="7.5" y1="14" x2="15.5" y2="14"></line>
            </svg>
          </div>
          <div style="color:oklch(72% 0.01 60); font-size:10.5px; font-weight:600;">Manual</div>
        </div>
      </div>

    </div>
  </sc-if>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { catatOpen: false };
  }
  renderVals() {
    const strong = 'oklch(12% 0.005 60)';
    const saleBg = 'oklch(93% 0.035 45)';
    const saleColor = 'oklch(50% 0.13 45)';
    const kasbonBg = 'oklch(92% 0.045 150)';
    const kasbonColor = 'oklch(40% 0.11 150)';
    const recentTx = [
      { kind: 'jual', title: '3x Indomie Goreng', time: '08:12', amount: '+Rp 10.500', amountColor: strong, iconBg: saleBg, iconColor: saleColor },
      { kind: 'jual', title: 'Minyak Goreng 1L', time: '07:45', amount: '+Rp 18.000', amountColor: strong, iconBg: saleBg, iconColor: saleColor },
      { kind: 'kasbon', title: 'Bu Yanti bayar kasbon', time: '07:20', amount: '+Rp 25.000', amountColor: kasbonColor, iconBg: kasbonBg, iconColor: kasbonColor },
      { kind: 'jual', title: 'Kopi Kapal Api', time: '06:58', amount: '+Rp 3.500', amountColor: strong, iconBg: saleBg, iconColor: saleColor },
    ];
    return {
      recentTx,
      catatOpen: this.state.catatOpen,
      openCatat: () => this.setState({ catatOpen: true }),
      closeCatat: () => this.setState({ catatOpen: false }),
    };
  }
}
</script>
</body>
</html>
