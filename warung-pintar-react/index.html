<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- Warna status bar HP (Android) pas aplikasi dibuka dari ikon layar HP. Disamain sama latar
         aplikasi (tema terang bawaan) biar ikon jam & baterai kebaca gelap di atas terang. Diganti
         otomatis waktu tema diganti - lihat efek theme-color di PhoneShell.jsx. -->
    <meta name="theme-color" content="#F1F1EF" />
    <title>Warung Pintar</title>
    <!-- Ikon Mang Warung. Sebelumnya index.html NGGAK punya link ikon sama sekali - browser
         otomatis nyari /favicon.ico yang emang nggak ada, jadi tab-nya nampilin ikon bola dunia
         bawaan Chrome. favicon.svg di public/ juga nggak kepakai karena nggak pernah ditunjuk.
         PNG-nya hasil konversi langsung dari src/assets/mangwarung.webp (aset asli, bukan gambar
         ulang) - lihat perintah sips di catatan commit. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/mangwarung-32.png" />
    <!-- Dipakai waktu pemilik warung "Add to Home Screen" di HP - ini yang paling sering kejadian,
         karena app-nya dipakai sambil jaga warung, bukan dibuka lewat tab browser tiap kali. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/mangwarung-180.png" />
    <!-- PWA: bikin aplikasi bisa dipasang ke layar HP (lihat tombol "Pasang aplikasi" di layar
         Lainnya). iOS nggak baca manifest buat ini - dia pakai apple-touch-icon di atas +
         apple-mobile-web-app-* di bawah. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" (bukan "black-translucent"). black-translucent bikin isi aplikasi NAIK KE BELAKANG
         status bar iPhone - dan karena nggak ada satu pun padding env(safe-area-inset-top) di CSS,
         judul layar & tombol paling atas ketiban jam/baterai di HP ber-notch. Masalah keduanya:
         black-translucent MAKSA tulisan status bar jadi putih, sementara tema bawaan aplikasi ini
         terang (--bg #F1F1EF) - putih di atas krem = jam & baterainya ilang.
         "black" nyelesein dua-duanya sekaligus: strip hitam solid, tulisan putih (kebaca di tema
         terang MAUPUN gelap), dan isi aplikasi mulai TEPAT di bawahnya. Warnanya juga udah
         nyambung sama theme_color #0A0A0A yang dipakai Android. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Warung Pintar" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
