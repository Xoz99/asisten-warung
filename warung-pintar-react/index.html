<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Warung Pintar</title>
    <!-- Ikon Mang Warung. Sebelumnya index.html NGGAK punya link ikon sama sekali - browser
         otomatis nyari /favicon.ico yang emang nggak ada, jadi tab-nya nampilin ikon bola dunia
         bawaan Chrome. favicon.svg di public/ juga nggak kepakai karena nggak pernah ditunjuk.
         PNG-nya hasil konversi langsung dari src/assets/mangwarung.webp (aset asli, bukan gambar
         ulang) - lihat perintah sips di catatan commit. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/mangwarung-32.png" />
    <!-- Dipakai waktu pemilik warung "Add to Home Screen" di HP - ini yang paling sering kejadian,
         karena app-nya dipakai sambil jaga warung, bukan dibuka lewat tab browser tiap kali. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/mangwarung-180.png" />
    <!-- PWA: bikin aplikasi bisa dipasang ke layar HP (lihat tombol "Pasang aplikasi" di layar
         Lainnya). iOS nggak baca manifest buat ini - dia pakai apple-touch-icon di atas +
         apple-mobile-web-app-* di bawah. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Warung Pintar" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
